<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="google-site-verification" content="VNpTha7sNURXeupoPjgh49fZIFR7y9cD-rqaBNpeXlA" />
    <meta name="description" content="AI companions that work with your apps to research, write, organize, and handle everyday tasks." />
    <title>companions.build</title>
    <script>
      // Resolve the stored/system theme before first paint so dark users never see a light flash.
      (function () {
        try {
          var stored = localStorage.getItem("companions.build:theme");
          var dark = stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#151517" : "#ffffff");
        } catch (error) { /* the app applies the theme after load */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
